<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      min-height: 480px;
      background: linear-gradient(160deg, #0d1629 0%, #14223f 60%, #181233 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #f0f4fa;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(56, 200, 255, 0.15);
    }

    .header h1 {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(90deg, #38c8ff, #8b7aff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .header p {
      font-size: 11px;
      color: #8c9bb4;
      margin-top: 3px;
    }

    .video-status {
      margin: 12px 18px 0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      background: rgba(56, 200, 255, 0.08);
      border: 1px solid rgba(56, 200, 255, 0.25);
      color: #38c8ff;
      word-break: break-all;
    }

    .video-status.error {
      background: rgba(255, 99, 99, 0.08);
      border-color: rgba(255, 99, 99, 0.3);
      color: #ff8484;
    }

    .chat-area {
      flex: 1;
      padding: 14px 18px;
      overflow-y: auto;
      max-height: 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-bottom-right-radius: 3px;
    }

    .msg.bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 3px;
    }

    .msg.loading {
      align-self: flex-start;
      color: #8c9bb4;
      font-style: italic;
      background: transparent;
      border: none;
    }

    .input-area {
      padding: 12px 18px 16px;
      border-top: 1px solid rgba(56, 200, 255, 0.15);
      display: flex;
      gap: 8px;
    }

    #question {
      flex: 1;
      padding: 10px 13px;
      border-radius: 10px;
      border: 1px solid rgba(56, 200, 255, 0.3);
      background: rgba(255, 255, 255, 0.05);
      color: #f0f4fa;
      font-size: 13px;
      outline: none;
    }

    #question:focus {
      border-color: #38c8ff;
      box-shadow: 0 0 0 2px rgba(56, 200, 255, 0.15);
    }

    #ask-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #38c8ff, #8b7aff);
      color: #0d1629;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #ask-btn:hover { opacity: 0.85; }
    #ask-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <h1>AskTube</h1>
    <p>Ask anything about this YouTube video</p>
  </div>

  <div id="video-status" class="video-status">Detecting video...</div>

  <div id="chat" class="chat-area"></div>

  <div class="input-area">
    <input type="text" id="question" placeholder="Ask a question..." />
    <button id="ask-btn">Ask</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
