<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1c1c1e;
      --surface-2: #272729;
      --ink: #f1f1f1;
      --ink-dim: #9a9a9f;
      --red: #ff3d3d;
      --red-deep: #c62828;
      --line: #2e2e31;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      height: 520px;
      background: var(--bg);
      font-family: "Roboto", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .logo {
      width: 34px;
      height: 24px;
      background: var(--red);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo::after {
      content: "";
      width: 0;
      height: 0;
      border-left: 9px solid #fff;
      border-top: 5.5px solid transparent;
      border-bottom: 5.5px solid transparent;
      margin-left: 2px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .header .tag {
      margin-left: auto;
      font-size: 11px;
      color: var(--ink-dim);
    }

    /* ── Video status: styled like a player timeline ── */
    .video-status {
      flex-shrink: 0;
      margin: 12px 16px 0;
      padding: 9px 12px 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 12px;
      color: var(--ink-dim);
      position: relative;
      word-break: break-all;
    }

    .video-status::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 6px;
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--red) 0 38%, var(--surface-2) 38%);
    }

    .video-status.connected { color: var(--ink); }
    .video-status.connected::before {
      content: "●  ";
      color: var(--red);
      font-size: 10px;
    }

    .video-status.error {
      color: #ff8a80;
      border-color: rgba(255, 61, 61, 0.35);
    }
    .video-status.error::after { background: var(--surface-2); }

    /* ── Chat ───────────────────────────── */
    .chat-area {
      flex: 1;
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-2) transparent;
    }

    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-thumb {
      background: var(--surface-2);
      border-radius: 3px;
    }

    .empty-hint {
      margin: auto;
      text-align: center;
      color: var(--ink-dim);
      font-size: 12.5px;
      line-height: 1.7;
      max-width: 240px;
    }

    .empty-hint b {
      display: block;
      color: var(--ink);
      font-size: 13.5px;
      margin-bottom: 4px;
    }

    .msg {
      max-width: 86%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      animation: rise 0.18s ease;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg { animation: none; }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--red-deep);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }

    /* timestamps like [4:07] get chip styling via JS */
    .msg.bot .ts {
      display: inline-block;
      background: var(--surface-2);
      color: var(--red);
      font-weight: 600;
      font-size: 11.5px;
      padding: 1px 7px;
      border-radius: 20px;
      margin: 0 1px;
    }

    .msg.loading {
      align-self: flex-start;
      background: transparent;
      color: var(--ink-dim);
      padding-left: 4px;
    }

    .msg.loading::after {
      content: "…";
      animation: dots 1.2s steps(4) infinite;
    }

    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
    }

    /* ── Input ──────────────────────────── */
    .input-area {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 12px 16px 14px;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }

    #question {
      flex: 1;
      padding: 10px 14px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    #question::placeholder { color: var(--ink-dim); }

    #question:focus { border-color: var(--red); }

    #ask-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    #ask-btn:hover { background: #ff5252; }
    #ask-btn:active { transform: scale(0.94); }
    #ask-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    #ask-btn:disabled {
      background: var(--surface-2);
      color: var(--ink-dim);
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"></div>
    <h1>AskTube</h1>
    <span class="tag">video Q&amp;A</span>
  </div>

  <div id="video-status" class="video-status">Detecting video…</div>

  <div id="chat" class="chat-area">
    <div class="empty-hint" id="empty-hint">
      <b>Ask this video anything</b>
      Answers come straight from the transcript, with timestamps you can jump to.
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="question" placeholder="Ask about this video…" autocomplete="off" />
    <button id="ask-btn" title="Ask" aria-label="Ask">➤</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
